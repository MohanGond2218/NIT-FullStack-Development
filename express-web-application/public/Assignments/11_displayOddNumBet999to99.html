<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Display Odd Number Between 999 to 99</title>
    </head>
    <body>
        <script>
            for (var i = 999; i >= 99; i--) {
                if (i % 2 != 0) {
                    console.log(`The Odd Number itherator is: ${i}`);
                }
            }
        </script>
    </body>
</html>
