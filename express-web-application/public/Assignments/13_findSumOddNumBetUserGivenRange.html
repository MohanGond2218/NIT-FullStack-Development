<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sum of Odd Num Between User Given Range</title>
    </head>
    <body>
        <script>
            var startRange = parseInt(prompt('Please Enter Start Range: '));
            var endRange = parseInt(prompt('Please Enter End Range: '));
            var sum = 0;
            for (var i = startRange; i <= endRange; i++) {
                if (i % 2 != 0) {
                   sum += i; 
                }
            }
            console.log(`The Sum of Odd Num Between User Geiven Range is: ${sum}`);
        </script>
    </body>
</html>
