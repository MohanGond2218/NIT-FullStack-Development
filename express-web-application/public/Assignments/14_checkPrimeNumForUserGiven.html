<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Check Prime Number</title>
    </head>
    <body>
        <script>
            var n = parseInt(prompt('Please provide a number to check prime or not: '));
            if (n < 2) {
                console.log(`Given number ${n} is not a prime number`);
            } else {
                var isPrime = true;
                for (var i = 2; i <= n-1; i++) {
                    if (n%i === 0) {
                        isPrime = false;
                        break;
                    }
                }
                if (isPrime) {
                    console.log(`Given number ${n} is prime number`);
                } else {
                    console.log(`Given number ${n} is not a prime number`);
                }
            }
        </script>
    </body>
</html>
