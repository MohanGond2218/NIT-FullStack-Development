<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sum of Even Num Bet 9 to 99</title>
    </head>
    <body>
        <script>
            var sum = 0;
            for (var i = 9; i <= 99; i++) {
                if (i % 2 === 0) {
                   sum += i; 
                }
            }
            console.log(`The Sum of Even Num Bet 9 to 99 is: ${sum}`);
        </script>
    </body>
</html>
