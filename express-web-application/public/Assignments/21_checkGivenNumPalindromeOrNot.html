<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Check Palindrome</title>
    </head>
    <body>
        <h2>Check Palindrome or not</h2>
        <script>
            var givenNum = parseInt(prompt('Enter a number to check palindrome: '));
            var n = givenNum;
            var rem;
            var reverse = 0;
            while (n > 0) {
                rem = n % 10;
                reverse = (reverse * 10) + rem;
                n = parseInt(n / 10);
            }
            if (givenNum === reverse) {
                console.log('Given Number is Palindrome', givenNum);
            } else {
                console.log('Given Number is not palindrome', givenNum);
            }
        </script>
    </body>
</html>
