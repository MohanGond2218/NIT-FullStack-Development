<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Find Sum of Individual Digit Between 1 to 100</title>
    </head>
    <body>
        <script>
            for (var i = 1; i <= 100; i++) {
                var sum = 0;
                var n = i;
                while (n > 0) {
                    var rem = n % 10;
                    sum += rem;
                    n = n / 10;
                    n = parseInt(n);
                }
                console.log(` The sum of ind digit of ${i} is: ${sum}`);
            }
        </script>
    </body>
</html>
