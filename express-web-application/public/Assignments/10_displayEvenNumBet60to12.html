<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Display Even Number Between 60 to 12</title>
    </head>
    <body>
        <script>
            for (var i = 60; i >= 12; i--) {
                if (i % 2 === 0) {
                    console.log(`The Even Number itherator is: ${i}`);
                }
            }
        </script>
    </body>
</html>
