<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Display Numbers 200 to 99</title>
    </head>
    <body>
        <script>
            for (var i = 200; i >= 99; i--) {
                console.log(`The Number iterator is: ${i}`);
            }
        </script>        
    </body>
</html>
