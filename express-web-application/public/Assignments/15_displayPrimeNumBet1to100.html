<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Check Prime Number</title>
    </head>
    <body>
        <script>
            for (var k = 1; k <= 100; k++) {
                if (k < 2) continue;
                var n = k;
                var isPrime = true;
                for (let i=2; i<n-1; i++) {
                    if (n%i === 0) {
                        isPrime = false;
                    }
                }
                if (isPrime) {
                    console.log('The Prime Number Iterator is: ',n);
                }
            }
        </script>
    </body>
</html>
