<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position -Fixed</title>
    <style>
        .container {
            border: 1px solid;
            height: 500px;
            width: 1000px;
            overflow: auto;
        }
        .block1,
        .block2,
        .block3,
        .block4,
        .block5 {
            width: 120px;
            height: 120px;
            border: 1px solid;
            font-weight: bold;
            padding: 10px;
            margin: 10px;
        }
        .block1 {
            background-color: yellow;
        }
        .block2 {
            background-color: blueviolet;
            position: fixed;
            left: 100px;
            top: 20px
        }
        .block3 {
            background-color: orange;
        }
        .block4 {
            background-color: aqua;
        }
        .block5 {
            background-color: aquamarine;
        }
        .pageHeading {
            text-align: center;
            padding: 20px;
            border: 2px solid;
            left: 5px;
            right: 5px;
            position: fixed;
            top: 0px;
        }
    </style>
</head>
<body>
    <div class="pageHeading">Page Heading</div>
    <div class="container">
        <div class="block1">Block1</div>
        <div class="block2">Block2</div>
        <div class="block3">Block3</div>
        <div class="block4">Block4</div>
        <div class="block5">Block5</div>
    </div>
    
</body>
</html>
