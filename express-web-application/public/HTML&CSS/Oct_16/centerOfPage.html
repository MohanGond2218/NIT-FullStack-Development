<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position - Sticky</title>
    <style>
     
        .block1 {
            background-color: yellow;
            width: 100px;
            height: 100px;
            border: 2px solid;
            position: absolute;
            left: 50%;
            top: 50%;
        }
        
      
    </style>
</head>
<body>
    <div class="container">
        <div class="block1">Block1</div>
      
    </div>
    
</body>
</html>
