<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position - Absolute</title>
    <style>
        .block1,
        .block2,
        .block3,
        .block4,
        .block5 {
            width: 120px;
            height: 120px;
            border: 1px solid;
            font-weight: bold;
        }
        .block1 {
            background-color: yellow;
        }
        .block2 {
            background-color: blueviolet;
            /* position: absolute;
            left: 100px;
            top: 100px; */
        }
        .block3 {
            background-color: orange;
            position: absolute;
            left: 200px;
            top: 200px;
        }
        .block4 {
            background-color: aqua;
        }
        .block5 {
            background-color: aquamarine;
        }
        .pElement {
            border: 1px solid;
            margin: 10px;
            padding: 20px;
            width: 500px;
            background-color: red;
            position: relative;
        }
        .gElement {
            border: 1px solid;
            margin: 10px;
            padding: 20px;
            width: 800px;
            background-color: yellowgreen;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="block1">Block1</div>
    <div class="block2">Block2</div>
    <div class="gElement">
        <div class="pElement">
            <div class="block3">Block3</div>
        </div>
    </div>
    <div class="block4">Block4</div>
    <div class="block5">Block5</div>
</body>
</html>
