<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demonstrating JS</title>
</head>
<body>
    <h3>Introduction to JavaScript</h3>
    <h2 id="mul"></h2>
    <script>
        var a = 20;
        var b = 30;
        var resultOfMultiplication = 20 * 30;
        console.log(`The Mul of ${a} and ${b} is ${resultOfMultiplication}`);
        alert(`The Mul of ${a} and ${b} is ${resultOfMultiplication}`);
        document.getElementById('mul').textContent = `The Mul of ${a} and ${b} is ${resultOfMultiplication}`;
    </script>
</body>
</html>
