<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeCasting</title>
</head>
<body>
    <script>
        var a = '90';
        console.log(a);
        console.log(typeof(a));

        // a = Number(a);
        a = parseInt(a);
        console.log(a);
        console.log(typeof(a));

        var avg = '89.4';
        console.log('value of avg: ',avg);
        console.log(typeof(avg));

        // avg = parseInt(avg);
        // console.log('value of avg: ',avg);
        // console.log(typeof(avg));

        console.log('\nParseFloat');
        avg = parseFloat(avg);
        console.log('value of avg: ',avg);
        console.log(typeof(avg));

        console.log('\ntoString');
        var total = 90;
        // total = total.toString();
        total = String(total);
        console.log('value of total: ',total);
        console.log(typeof(total));

        console.log('\nDynamic Typecasting');
        var total = 90;
        total = '90';
        console.log('value of total: ',total);
        console.log(typeof(total));

        console.log('\nBoolean');
        var total = 90;
        total = Boolean(total);
        console.log('value of total: ',total);
        console.log(typeof(total));
    </script>
</body>
</html>
