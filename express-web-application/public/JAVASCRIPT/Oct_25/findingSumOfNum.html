    <script>
        var sum = 0;
        var n = 347;
        var rem;
        while (n>0) {
            rem = n % 10;
            console.log('rem is: ', rem);
            sum += rem;
            n = parseInt(n/10);
            console.log('n value is: ', n);
        }
        console.log('The Sum of num is: ', sum);
    </script>
