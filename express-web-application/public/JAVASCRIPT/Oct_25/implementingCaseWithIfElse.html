<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a1 = prompt('Enter a number: ');
        a1 = parseInt(a1);

        var a2 = prompt('Enter a number: ');
        a2 = parseInt(a2);

        var userSelection = prompt('Choose Sum/Mul/Div/Sub: ');

        if (userSelection==='Sum') {
            console.log(`Sum is: ${a1+a2}`);
        } else if (userSelection==='Mul') {
            console.log(`Mul is: ${a1*a2}`);
        } else if (userSelection==='Div') {
            console.log(`Div is: ${a1/a2}`);
        } else if (userSelection==='Sub') {
            console.log(`Sub is: ${a1-a2}`);
        } else {
            console.log('Wrong Selection');
        }
    </script>
</body>
</html>
