    <body>
        <script>
            var n = 153;
            var temp = n;
            var len = 0;
            while (n > 0) {
                len++;
                n= parseInt(n/10);
            }
            console.log('lenght', len);

            n = temp;

            var amstrongNo = 0;
            var rem;
            while (n > 0) {
                rem = n % 10; 
                amstrongNo = amstrongNo + rem ** len;
            }

        </script>
